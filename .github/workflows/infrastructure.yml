# =============================================================================
# Workflow для развёртывания инфраструктуры через Terraform
# =============================================================================
name: Deploy Infrastructure

on:
  # Автоматический запуск при пуше в main (после мержа PR)
  push:
    branches: [ main ]
    paths:
      - 'infrastructure/**'
  # Запуск проверки плана при создании/обновлении PR
  pull_request:
    branches: [ main ]
    paths:
      - 'infrastructure/**'
  # Возможность ручного запуска из интерфейса GitHub
  workflow_dispatch:

jobs:
  # ===========================================================================
  # Job 1: Проверка плана (только для PR, без применения)
  # ===========================================================================
  terraform-plan:
    name: Terraform Plan (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Кэширование провайдеров Terraform для ускорения init
      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: infrastructure/.terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('infrastructure/**/*.tf') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      # Декодирование base64-секрета в файл JSON-ключа
      - name: Write Service Account Key to File
        run: echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY }}' | base64 -d > ${{ github.workspace }}/sa-key.json

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="access_key=$TF_VAR_access_key" \
            -backend-config="secret_key=$TF_VAR_secret_key"
        working-directory: ./infrastructure
        env:
          TF_VAR_access_key: ${{ secrets.YC_ACCESS_KEY }}
          TF_VAR_secret_key: ${{ secrets.YC_SECRET_KEY }}
          TF_VAR_bucket_name: ${{ secrets.TF_BUCKET_NAME }}
          TF_VAR_service_account_key_file: ${{ github.workspace }}/sa-key.json
          TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}

      - name: Terraform Plan
        run: terraform plan
        working-directory: ./infrastructure
        env:
          TF_VAR_access_key: ${{ secrets.YC_ACCESS_KEY }}
          TF_VAR_secret_key: ${{ secrets.YC_SECRET_KEY }}
          TF_VAR_bucket_name: ${{ secrets.TF_BUCKET_NAME }}
          TF_VAR_service_account_key_file: ${{ github.workspace }}/sa-key.json
          TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}

  # ===========================================================================
  # Job 2: Применение изменений (только для push в main)
  # ===========================================================================
  terraform-apply:
    name: Terraform Apply (main)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: infrastructure/.terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('infrastructure/**/*.tf') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2

      - name: Write Service Account Key to File
        run: echo '${{ secrets.YC_SERVICE_ACCOUNT_KEY }}' | base64 -d > ${{ github.workspace }}/sa-key.json

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="access_key=$TF_VAR_access_key" \
            -backend-config="secret_key=$TF_VAR_secret_key"
        working-directory: ./infrastructure
        env:
          TF_VAR_access_key: ${{ secrets.YC_ACCESS_KEY }}
          TF_VAR_secret_key: ${{ secrets.YC_SECRET_KEY }}
          TF_VAR_bucket_name: ${{ secrets.TF_BUCKET_NAME }}
          TF_VAR_service_account_key_file: ${{ github.workspace }}/sa-key.json
          TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ./infrastructure
        env:
          TF_VAR_access_key: ${{ secrets.YC_ACCESS_KEY }}
          TF_VAR_secret_key: ${{ secrets.YC_SECRET_KEY }}
          TF_VAR_bucket_name: ${{ secrets.TF_BUCKET_NAME }}
          TF_VAR_service_account_key_file: ${{ github.workspace }}/sa-key.json
          TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}