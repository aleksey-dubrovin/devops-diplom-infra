name: Развертывание инфраструктуры

on:
  push:
    branches: [ main ]
    paths:
      - 'infrastructure/**'
  workflow_dispatch:   # ручной запуск

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Загрузка кода
        uses: actions/checkout@v4

      - name: Настройка Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Инициализация Terraform
        run: |
          terraform init \
            -backend-config="bucket=$TF_VAR_bucket_name" \
            -backend-config="access_key=$TF_VAR_access_key" \
            -backend-config="secret_key=$TF_VAR_secret_key" \
        working-directory: ./infrastructure
        env:
          TF_VAR_access_key: ${{ secrets.YC_ACCESS_KEY }}
          TF_VAR_secret_key: ${{ secrets.YC_SECRET_KEY }}
          TF_VAR_bucket_name: ${{ secrets.TF_BUCKET_NAME }}
          TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID}}
          TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
          TF_VAR_service_account_key: ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}

      - name: Проверка изменений (Plan)
        run: terraform plan
        working-directory: ./infrastructure
        env:
          TF_VAR_access_key: ${{ secrets.YC_ACCESS_KEY }}
          TF_VAR_secret_key: ${{ secrets.YC_SECRET_KEY }}
          TF_VAR_bucket_name: ${{ secrets.TF_BUCKET_NAME }}
          TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID}}
          TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
          TF_VAR_service_account_key: ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}

      - name: Применение изменений (Apply)
        run: terraform apply -auto-approve
        working-directory: ./infrastructure
        env:
          TF_VAR_access_key: ${{ secrets.YC_ACCESS_KEY }}
          TF_VAR_secret_key: ${{ secrets.YC_SECRET_KEY }}
          TF_VAR_bucket_name: ${{ secrets.TF_BUCKET_NAME }}
          TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID}}
          TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
          TF_VAR_service_account_key: ${{ secrets.YC_SERVICE_ACCOUNT_KEY }}
